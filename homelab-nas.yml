---
# CM3588 NAS (OpenMediaVault): homelab admin user + Twingate gateway SSH User CA trust.
# Prerequisites:
#   - SSH as OMV admin (inventory homelab_nas ansible_user, default admin)
#   - Flux gateway with gateway.ssh.enabled
#
# Usage:
#   ansible-playbook -i inventory/my-cluster/hosts.yml homelab-nas.yml \
#     -e ansible_user=admin --ask-become-pass
#
# After this: ssh snuffy@jellyfin.ssh via Twingate.
#
# OMV often ignores sshd_config.d drop-ins (no `Include .../sshd_config.d/*.conf` in its
# sshd_config). roles/twingate_ssh_sshd detects that and falls back to writing
# TrustedUserCAKeys directly into sshd_config, so no manual step is needed here. If gateway
# SSH still hangs after the banner, run on the NAS: sudo sshd -T | grep -i trusteduserca

- hosts: homelab_nas
  gather_facts: false
  become: true
  vars:
    ansible_pipelining: false
    ansible_ssh_timeout: 30
  roles:
    - role: homelab_admin
    - role: twingate_ssh_sshd
