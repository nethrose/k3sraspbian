[defaults]
inventory = inventory/my-cluster/hosts.yml
nocows = True
roles_path = ./roles
remote_tmp = $HOME/.ansible/tmp
local_tmp = $HOME/.ansible/tmp
# Off: the Twingate SSH path closes a channel ~10s after stdin closes, and a
# pipelined task that runs longer loses its result after doing its work.
pipelining = False
host_key_checking = False
deprecation_warnings = False
callbacks_enabled = profile_tasks

[privilege_escalation]
become = True
