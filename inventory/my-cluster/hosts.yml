k3s_cluster:
  children:
    k3sleaders:
      hosts:
        leader01:
          ansible_host: 192.168.0.12
          # Literal, not "{{ inventory_hostname }}": under delegate_to, inventory_hostname
          # resolves to the delegating host, not this one, so a templated value here would
          # silently pick up the wrong user. See upgrade.yml's delegated wait task.
          ansible_user: leader01
    k3sfollowers:
      hosts:
        follower01:
          ansible_host: 192.168.0.11
          ansible_user: follower01
        follower02:
          ansible_host: 192.168.0.10
          ansible_user: follower02
        follower03:
          ansible_host: 192.168.0.9
          ansible_user: follower03

# CM3588 NAS (OpenMediaVault + Jellyfin). Bootstrap as admin; homelab-nas.yml creates homelab_admin_user.
homelab_nas:
  hosts:
    cm3588:
      ansible_host: 192.168.0.72
      ansible_user: admin
