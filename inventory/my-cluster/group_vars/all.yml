---
# The version the nodes should run; normally equal to `k3s --version` on every node. It is ahead
# of them only between bumping it and running upgrade.yml. In that window, run site.yml only with
# --limit to the leader (to apply a changed extra_server_args), never unlimited: on the agents the
# download role would swap /usr/local/bin/k3s to the new pin without restarting k3s.
# The download role refuses a downgrade or multi-minor jump. Bump one minor at a time, then run
# upgrade.yml (see README.md "Upgrading k3s").
k3s_version: v1.37.2+k3s1
k3s_use_latest_version: false
# Modern Pi OS (kernel 6.18+) is nftables-only; leave false unless ip_tables.ko exists.
k3s_use_iptables_legacy: false
# This cluster is IPv4-only (single-stack node/pod/service addressing) and the nodes do
# not run with IPv6 forwarding on today; leave the kernel setting untouched.
prereq_enable_ipv6_forwarding: false
systemd_dir: /etc/systemd/system
master_ip: "{{ hostvars[groups['k3sleaders'][0]]['ansible_default_ipv4']['address'] }}"
# Nothing on this cluster uses the bundled Traefik ingress controller (no Ingress or Traefik
# custom resources exist); disabling it stops it listening on :80/:443 on every node and removes
# it as a source of advisories. Remove this flag to let k3s redeploy Traefik.
# From k3s v1.37 the Gateway API CRDs are their own packaged component (`gateway-api-crd`),
# separate from Traefik; it is disabled too so k3s never deploys or takes over that component.
# Nothing on this cluster uses Gateway API.
extra_server_args: "--disable=traefik --disable=gateway-api-crd"
extra_agent_args: ""

# Public DNS the k3s nodes resolve through directly, independent of DHCP/router DNS
# (e.g. a LAN Pi-hole), so CoreDNS and in-cluster Twingate connectors keep working
# during a Pi-hole outage.
node_dns_servers:
  - 1.1.1.1
  - 9.9.9.9

# Shared homelab admin (Twingate SSH gateway upstream user; must match gateway.ssh.gateway.username in your GitOps repo).
homelab_admin_user: snuffy
homelab_admin_group: sudo
homelab_admin_ssh_pubkey_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
# false = rely on Twingate gateway SSH CA (cert auth). true only for initial bootstrap.
homelab_admin_install_ssh_pubkey: false

twingate_sshd_trusted_user_ca_keys_path: /etc/ssh/twingate-gateway-user-ca.pub
# Public key of the gateway's manual SSH User CA (ssh_ca.pub from k3s-gitops
# scripts/gen-gateway-cas.sh; the same key registered with Twingate as the SSH CA).
# Public key only — never put the private key here. Override per-run with -e if preferred.
twingate_gateway_user_ca_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDG+162gLMwxw3zrVNwHMpk42+p01EVHYkkPdpBlYuOr twingate-gateway-ca"
