---
- name: Get the latest stable version of k3s
  ansible.builtin.uri:
    url: https://api.github.com/repos/k3s-io/k3s/releases/latest
    return_content: true
  delegate_to: localhost
  become: false
  run_once: true
  register: k3s_latest_release
  when: k3s_use_latest_version | default(true) | bool

- name: Set k3s_version from the latest release
  ansible.builtin.set_fact:
    k3s_version: "{{ k3s_latest_release.json.tag_name }}"
  when: k3s_use_latest_version | default(true) | bool

- name: Use pinned k3s_version from inventory
  ansible.builtin.debug:
    msg: "Using pinned k3s_version={{ k3s_version }}"
  when: not (k3s_use_latest_version | default(true) | bool)
