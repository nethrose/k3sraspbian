---
# Shared admin user for homelab operations and Twingate SSH gateway upstream auth.
# Ansible still connects as the per-host user from inventory (leader01, follower01, …).
- name: Ensure homelab admin group exists
  ansible.builtin.group:
    name: "{{ homelab_admin_group }}"
    state: present

# NAS hardening (homelab_nas, item 12.2): the admin user left root/disk/shadow/kmem by
# hand on the live NAS. homelab_admin_exclusive_groups flips the user task below to
# append: false, so it alone keeps those groups off, and a rebuilt box doesn't come back
# with them. No-op elsewhere: append stays true (default), which never removes a group.
- name: Create homelab admin user
  ansible.builtin.user:
    name: "{{ homelab_admin_user }}"
    groups: "{{ [homelab_admin_group] + homelab_admin_extra_groups }}"
    append: "{{ not (homelab_admin_exclusive_groups | bool) }}"
    shell: /bin/bash
    create_home: true
    state: present

# NAS hardening (homelab_nas, item 12.0): lock the vendor/default accounts (root, pi) so a
# rebuilt box doesn't come back with a guessable vendor password. Nobody logs in as them
# day to day, so there's no lockout risk. Empty list elsewhere: no-op.
- name: Look up vendor/default accounts
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: false
  loop: "{{ homelab_admin_lock_vendor_accounts }}"
  register: homelab_admin_vendor_lookup

- name: Lock vendor/default accounts that exist
  ansible.builtin.user:
    name: "{{ item.item }}"
    password_lock: true
    create_home: false
  loop: "{{ homelab_admin_vendor_lookup.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.ansible_facts.getent_passwd[item.item] is not none

# Static pubkey is bootstrap-only. With gateway SSH CA trust, snuffy@*.ssh uses cert auth.
# Set homelab_admin_install_ssh_pubkey: true only for first bootstrap before CA is on the node.
# On homelab_nas this never touches the admin's key either way: that key lives in OMV's own
# store (/var/lib/openmediavault/ssh/authorized_keys/<user>), not ~/.ssh/authorized_keys.
# Leave this task as-is for the NAS — pointing it at the OMV store would risk a lockout.
- name: Manage SSH public key for homelab admin
  ansible.posix.authorized_key:
    user: "{{ homelab_admin_user }}"
    state: "{{ 'present' if homelab_admin_install_ssh_pubkey | bool else 'absent' }}"
    key: "{{ lookup('file', homelab_admin_ssh_pubkey_file) }}"
    comment: "homelab admin (ansible)"
  when: homelab_admin_install_ssh_pubkey | bool or homelab_admin_remove_static_ssh_pubkey | default(true) | bool

- name: Passwordless sudo for homelab admin
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ homelab_admin_user }}"
    content: "{{ homelab_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: homelab_admin_passwordless_sudo | bool

# NAS hardening (homelab_nas, item 12): the NOPASSWD grant above was removed by hand on
# the live NAS. Actively enforce its absence rather than merely skipping the copy, so it
# doesn't come back if someone recreates the file by hand or by a stale run.
- name: Remove passwordless sudo drop-in where not permitted
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ homelab_admin_user }}"
    state: absent
  when: not homelab_admin_passwordless_sudo | bool
