---
# The join token lives in a root-only EnvironmentFile (K3S_TOKEN), never in the unit itself.
- name: Write K3s agent environment file
  ansible.builtin.template:
    src: k3s-node.env.j2
    dest: "{{ systemd_dir }}/k3s-node.service.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s-node

- name: Copy K3s service file
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ systemd_dir }}/k3s-node.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s-node

- name: Enable and start K3s agent service
  ansible.builtin.systemd:
    name: k3s-node
    daemon_reload: true
    state: started
    enabled: true
